<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alien Digger</title>
<!-- Studio ident. Vendored from gameCentral/intro/hallucinated-intro.js so this
     game stays a self-contained deploy; re-copy that file to take an update.
     Plain script, not a module: it defines window.HallucinatedIntro. -->
<script src="intro/hallucinated-intro.js"></script>
<style>
  :root { --ink: #d7d2e0; --dim: #8c85a0; --trim: #2fd2e8; --panel: #161222; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0d0a14; color: var(--ink);
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    display: block; background: #0d0a14;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 2px solid #2b2438; border-radius: 4px;
    touch-action: none;
  }
  #help { margin-top: 10px; color: var(--dim); font-size: 12px; text-align: center; }
  #help b { color: var(--ink); font-weight: 600; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0d0a14; font-size: 13px; color: var(--dim); z-index: 20;
  }

  /* ---- touch controls: only shown on devices without a real keyboard ---- */
  #touch { display: none; }
  body.touch #touch {
    display: block; position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
  }
  body.touch #help { display: none; }

  .pad {
    position: absolute; bottom: calc(18px + env(safe-area-inset-bottom));
    left: 18px; width: 168px; height: 168px; pointer-events: auto;
  }
  .pad button {
    position: absolute; width: 56px; height: 56px;
    background: rgba(22,18,34,0.72); color: var(--trim);
    border: 2px solid rgba(47,210,232,0.45); border-radius: 10px;
    font: 700 20px/1 ui-monospace, monospace; padding: 0;
  }
  .pad button:active, .pad button.on {
    background: rgba(47,210,232,0.3); border-color: var(--trim);
  }
  .pad .up    { left: 56px; top: 0; }
  .pad .left  { left: 0; top: 56px; }
  .pad .right { left: 112px; top: 56px; }
  .pad .down  { left: 56px; top: 112px; }

  .actions {
    position: absolute; bottom: calc(28px + env(safe-area-inset-bottom));
    right: 18px; display: flex; flex-direction: column; gap: 12px;
    pointer-events: auto;
  }
  .actions button {
    width: 84px; height: 62px; border-radius: 12px;
    background: rgba(22,18,34,0.72); color: var(--trim);
    border: 2px solid rgba(47,210,232,0.45);
    font: 700 13px/1 ui-monospace, monospace;
  }
  .actions button:active { background: rgba(47,210,232,0.3); }
  .actions .restart { color: #e8b02b; border-color: rgba(232,176,43,0.45); }
</style>
</head>
<body>

<!-- Start the studio ident before anything else paints. This has to be a
     classic script at the top of <body>, not the module below: a module is
     deferred until the document has parsed and its imports have resolved, which
     would let the loading screen show for a beat first. Body exists by here, so
     the overlay can attach immediately. -->
<script>
  window.__studioIntro = (function () {
    try {
      var q = new URLSearchParams(location.search);
      // ?dev boots the test hooks and would otherwise wait out the ident, with
      // its overlay swallowing the first synthetic click.
      if (q.has('dev') || q.has('nointro') || !window.HallucinatedIntro) {
        return Promise.resolve();
      }
      return window.HallucinatedIntro.play({
        skippable: true,
        // A sting needs a prior user gesture; on a cold load there is none, so
        // it would be dropped silently. Turn on if the ident ever moves behind
        // a click-to-start.
        sound: false,
      }).catch(function () {});
    } catch (e) { return Promise.resolve(); }
  })();
</script>

  <div id="wrap">
    <canvas id="screen" width="960" height="600"></canvas>
    <div id="help">
      <b>WASD</b> / <b>arrows</b> drill &nbsp;·&nbsp;
      <b>E</b> plant charge &nbsp;·&nbsp; <b>R</b> restart
    </div>
  </div>

  <div id="touch">
    <div class="pad">
      <button class="up"    data-dir="up"    aria-label="drill up">▲</button>
      <button class="left"  data-dir="left"  aria-label="drill left">◀</button>
      <button class="right" data-dir="right" aria-label="drill right">▶</button>
      <button class="down"  data-dir="down"  aria-label="drill down">▼</button>
    </div>
    <div class="actions">
      <button data-tap="plant" aria-label="plant charge">PLANT</button>
      <button class="restart" data-tap="restart" aria-label="restart">RESTART</button>
    </div>
  </div>

  <div id="boot">loading art…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
