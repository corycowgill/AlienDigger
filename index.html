<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alien Digger</title>
<!-- Studio ident. Vendored from gameCentral/intro/hallucinated-intro.js so this
     game stays a self-contained deploy; re-copy that file to take an update.
     Plain script, not a module: it defines window.HallucinatedIntro. -->
<script src="intro/hallucinated-intro.js"></script>
<style>
  :root { --ink: #d7d2e0; --dim: #8c85a0; --trim: #2fd2e8; --panel: #161222; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0d0a14; color: var(--ink);
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    display: block; background: #0d0a14;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 2px solid #2b2438; border-radius: 4px;
    touch-action: none;
  }
  #help { margin-top: 10px; color: var(--dim); font-size: 12px; text-align: center; }
  #help b { color: var(--ink); font-weight: 600; }
  #help .pad-only { display: none; }
  /* A connected pad takes over from both other schemes, including on a tablet
     that could show the touch controls. */
  body.gamepad #help .key-only { display: none; }
  body.gamepad #help .pad-only { display: inline; }
  body.gamepad #touch { display: none; }
  body.gamepad #help { display: block; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0d0a14; font-size: 13px; color: var(--dim); z-index: 20;
  }

  /* ---- touch controls: only shown on devices without a real keyboard ---- */
  #touch { display: none; }
  body.touch #touch {
    display: block; position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
  }
  body.touch #help { display: none; }

  /* Sized against the viewport, not in fixed pixels. At 56px a button was 45%
     of the screen height on a 375px-tall phone, and the pad swallowed the
     bottom-left of the play area. */
  :root { --btn: clamp(38px, 12.5vh, 58px); }

  .pad {
    position: absolute; bottom: calc(10px + env(safe-area-inset-bottom));
    left: 10px;
    width: calc(var(--btn) * 3); height: calc(var(--btn) * 3);
    pointer-events: auto;
    display: grid;
    grid-template-columns: repeat(3, var(--btn));
    grid-template-rows: repeat(3, var(--btn));
  }
  /* Eight directions, not four. Diagonals matter now -- a straight shaft is the
     only one that climbs out easily -- and reaching one by pressing two edges
     at once needs a second thumb. */
  .pad button {
    background: rgba(22,18,34,0.52); color: var(--trim);
    border: 2px solid rgba(47,210,232,0.34); border-radius: 8px;
    font: 700 max(13px, calc(var(--btn) * 0.34))/1 ui-monospace, monospace;
    padding: 0; margin: 1px;
  }
  .pad button.diag { color: rgba(47,210,232,0.6); border-color: rgba(47,210,232,0.2); }
  .pad button:active, .pad button.on {
    background: rgba(47,210,232,0.34); border-color: var(--trim); color: #fff;
  }
  .pad .hole { pointer-events: none; }

  .actions {
    position: absolute; bottom: calc(14px + env(safe-area-inset-bottom));
    right: 10px; display: flex; flex-direction: column;
    gap: max(6px, 1.4vh); pointer-events: auto;
  }
  .actions button {
    width: calc(var(--btn) * 1.5); height: calc(var(--btn) * 0.92);
    border-radius: 10px;
    background: rgba(22,18,34,0.52); color: var(--trim);
    border: 2px solid rgba(47,210,232,0.34);
    font: 700 max(10px, calc(var(--btn) * 0.22))/1 ui-monospace, monospace;
  }
  .actions button:active { background: rgba(47,210,232,0.34); }
  .actions .restart { color: #e8b02b; border-color: rgba(232,176,43,0.4); }
  .actions .mute { height: calc(var(--btn) * 0.7); color: #8c85a0;
                   border-color: rgba(140,133,160,0.34); }

  #rotate-hint { display: none; }
  body.touch #rotate-hint {
    position: fixed; left: 0; right: 0; z-index: 11;
    text-align: center; color: #6f6883; font-size: 12px;
    pointer-events: none;
  }

  /* Portrait has height to spare -- a 960x600 canvas scaled to a 390-wide
     screen is only 244 tall in an 844-tall viewport. Centring it left dead
     bands above and below while the controls sat on top of the play area, so
     portrait stacks instead: picture up top, controls in the room underneath,
     nothing overlapping, and the buttons get bigger because they can. */
  @media (orientation: portrait) {
    body.touch { --btn: clamp(52px, 8.5vh, 84px); }
    /* #wrap is a column flex, so the main axis is vertical: it is
       justify-content that moves the canvas up, not align-items. */
    body.touch #wrap { justify-content: flex-start; padding-top: 5vh; }
    body.touch .pad { bottom: calc(12vh + env(safe-area-inset-bottom)); left: 6vw; }
    body.touch .actions {
      bottom: calc(12vh + env(safe-area-inset-bottom)); right: 6vw;
      gap: max(8px, 1.2vh);
    }
    /* The canvas is 960x600, so at full width its height is 62.5vw; the hint
       sits just under it. */
    body.touch #rotate-hint { display: block; top: calc(5vh + 62.5vw + 16px); }
  }
</style>
</head>
<body>

<!-- Start the studio ident before anything else paints. This has to be a
     classic script at the top of <body>, not the module below: a module is
     deferred until the document has parsed and its imports have resolved, which
     would let the loading screen show for a beat first. Body exists by here, so
     the overlay can attach immediately. -->
<script>
  window.__studioIntro = (function () {
    try {
      var q = new URLSearchParams(location.search);
      // ?dev boots the test hooks and would otherwise wait out the ident, with
      // its overlay swallowing the first synthetic click.
      if (q.has('dev') || q.has('nointro') || !window.HallucinatedIntro) {
        return Promise.resolve();
      }
      return window.HallucinatedIntro.play({
        skippable: true,
        // A sting needs a prior user gesture; on a cold load there is none, so
        // it would be dropped silently. Turn on if the ident ever moves behind
        // a click-to-start.
        sound: false,
      }).catch(function () {});
    } catch (e) { return Promise.resolve(); }
  })();
</script>

  <div id="wrap">
    <canvas id="screen" width="960" height="600"></canvas>
    <div id="help">
      <span class="key-only">
        <b>WASD</b> / <b>arrows</b> drill &nbsp;·&nbsp;
        <b>E</b> plant charge &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp; <b>H</b> help
      </span>
      <span class="pad-only">
        <b>stick</b> / <b>d-pad</b> drill &nbsp;·&nbsp;
        <b>A</b> plant charge &nbsp;·&nbsp; <b>Y</b> restart &nbsp;·&nbsp; <b>X</b> help
      </span>
    </div>
  </div>

  <!-- Portrait only. The canvas is 16:10, so on a 9:19.5 screen it can never
       fill the height however it is scaled -- worth saying rather than leaving
       the player to wonder why the view is small. -->
  <div id="rotate-hint">↻ turn sideways for a bigger view</div>

  <div id="touch">
    <div class="pad">
      <button class="diag" data-dir="up left"    aria-label="drill up and left">↖</button>
      <button              data-dir="up"         aria-label="drill up">▲</button>
      <button class="diag" data-dir="up right"   aria-label="drill up and right">↗</button>
      <button              data-dir="left"       aria-label="drill left">◀</button>
      <span class="hole"></span>
      <button              data-dir="right"      aria-label="drill right">▶</button>
      <button class="diag" data-dir="down left"  aria-label="drill down and left">↙</button>
      <button              data-dir="down"       aria-label="drill down">▼</button>
      <button class="diag" data-dir="down right" aria-label="drill down and right">↘</button>
    </div>
    <div class="actions">
      <button data-tap="plant" aria-label="plant charge">PLANT</button>
      <button class="restart" data-tap="restart" aria-label="restart">RESTART</button>
      <button class="mute" data-tap="mute" aria-label="toggle sound">SOUND</button>
      <button class="mute" data-tap="help" aria-label="how to play">HELP</button>
    </div>
  </div>

  <div id="boot">loading art…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
